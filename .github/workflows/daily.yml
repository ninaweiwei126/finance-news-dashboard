# 每日全量采集（GitHub Actions 海外网络，雅虎/Investing/TradingView 可用）
# 每天 22:00 UTC = 北京时间 06:00（美股收盘后），自动提交数据，Pages 自动重建
name: daily-collect

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run collector
        run: python3 run_daily.py
      - name: Commit & push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "chore(data): daily finance report $(date -u +%F)"
          git pull --rebase --autostash origin main || true
          git push
