name: Deploy NVDA GOOGL Signal Dashboard

on:
  schedule:
    - cron: "15 22 * * 1-5"
  workflow_dispatch:
  push:
    paths:
      - "signal-dashboard/**"
      - ".github/workflows/signal-dashboard.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: signal-dashboard-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate latest signal dashboard
        run: python signal-dashboard/scripts/run_github_update.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Switch Pages source to GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: signal-dashboard/docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
