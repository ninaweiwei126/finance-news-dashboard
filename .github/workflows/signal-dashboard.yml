name: Update NVDA GOOGL Signal Dashboard

on:
  schedule:
    - cron: "15 22 * * 1-5"
  workflow_dispatch:
    inputs:
      send_test_email:
        description: "Send a test email even if state did not change"
        required: false
        type: boolean
        default: false
  push:
    paths:
      - "signal-dashboard/scripts/**"
      - "signal-dashboard/README.md"
      - ".github/workflows/signal-dashboard.yml"

permissions:
  contents: write

concurrency:
  group: signal-dashboard-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Save previous status
        run: cp signal-dashboard/docs/nvda_googl_status.json "$RUNNER_TEMP/previous_status.json"
      - name: Generate latest signal dashboard
        run: python signal-dashboard/scripts/run_github_update.py
      - name: Send signal email
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python signal-dashboard/scripts/email_notify.py             --previous "$RUNNER_TEMP/previous_status.json"             --current signal-dashboard/docs/nvda_googl_status.json             ${{ inputs.send_test_email && '--force' || '' }}
      - name: Commit updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signal-dashboard/docs
          if git diff --cached --quiet; then
            echo "No dashboard changes"
            exit 0
          fi
          git commit -m "chore(signal): update NVDA GOOGL dashboard"
          git pull --rebase origin main
          git push
