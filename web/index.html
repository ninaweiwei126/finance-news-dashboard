<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球市场金融资讯日报</title>
<link rel="stylesheet" href="css/design-tokens.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-theme="dark">

<header class="topbar">
  <div class="wrap topbar-inner">
    <div class="brand">
      <span class="logo">📈</span>
      <span>全球市场金融资讯日报</span>
    </div>
    <div class="topbar-right">
      <span class="date-chip" id="dateChip">加载中…</span>
      <button class="icon-btn" id="themeBtn" title="切换深浅色主题">🌙 / ☀️</button>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- 指数横条 -->
  <section id="indicesStrip" aria-label="主要指数"></section>

  <div class="grid-main">
    <!-- 左：每日 Top5 时间线 -->
    <section class="card" id="top5Card">
      <div class="card-head">
        <div>
          <div class="card-title">今日精选 Top 5</div>
          <div class="card-sub">已核实 · 按时间先后排序</div>
        </div>
      </div>
      <div id="top5Body"><div class="loading"><div class="spinner"></div>加载中…</div></div>
    </section>

    <!-- 右：行情 -->
    <section class="card" id="quotesCard">
      <div class="card-head">
        <div>
          <div class="card-title">核心成分股 / 蓝筹 / 科技股</div>
          <div class="card-sub" id="quotesSub">涨跌幅 · 多源核实</div>
        </div>
      </div>
      <div class="tabs" id="marketTabs">
        <button class="tab active" data-market="us">美股</button>
        <button class="tab" data-market="hk">港股</button>
        <button class="tab" data-market="cn">A股</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>名称</th><th class="num">最新价</th><th class="num">涨跌额</th>
              <th class="num">涨跌幅</th><th>核实</th>
            </tr>
          </thead>
          <tbody id="quotesBody">
            <tr><td colspan="5"><div class="loading"><div class="spinner"></div>加载中…</div></td></tr>
          </tbody>
        </table>
      </div>
      <div class="card-head" style="border-top:1px solid var(--color-border);border-bottom:none">
        <div class="card-title">今日领涨 / 领跌</div>
      </div>
      <div class="movers-grid" id="moversGrid"></div>
    </section>
  </div>

  <!-- 数据源状态 -->
  <footer class="footer">
    <div class="card-head" style="border-bottom:none">
      <div class="card-title">数据源状态</div>
      <div class="card-sub" id="sourceNote"></div>
    </div>
    <div class="src-grid" id="srcGrid" style="padding:0 var(--space-5) var(--space-4)"></div>
    <p class="foot-note" id="footNote"></p>
  </footer>
</main>

<script src="js/app.js"></script>
</body>
</html>
